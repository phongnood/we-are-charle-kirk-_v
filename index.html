        function resetApp() {
            document.getElementById('welcome-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
        }

        function startExam(id) {
            const db = (currentSubject === 'khtn') ? dbKHTN : dbGDCD;
            if (id === 'all') {
                activeQuestions = [];
                Object.keys(db).forEach(k => { if(db[k].length > 0) activeQuestions.push(...db[k]); });
            } else {
                activeQuestions = [...db[id]];
            }
            currentIndex = 0;
            score = 0;
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            isChecked = false;
            selectedMCIdx = null;
            const q = activeQuestions[currentIndex];
            document.getElementById('question-progress').innerText = `Câu ${currentIndex + 1} / ${activeQuestions.length}`;
            document.getElementById('question-content').innerHTML = q.q;
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('action-btn').innerText = "Kiểm tra đáp án";

            const mcContainer = document.getElementById('mc-options');
            const tfContainer = document.getElementById('tf-options');
            const saContainer = document.getElementById('short-answer-box');

            mcContainer.classList.add('hidden');
            tfContainer.classList.add('hidden');
            saContainer.classList.add('hidden');

            if (q.type === 'mc') {
                document.getElementById('question-type-badge').innerText = "Phần 1: Trắc nghiệm 4 lựa chọn";
                mcContainer.classList.remove('hidden');
                mcContainer.innerHTML = '';
                q.opts.forEach((opt, idx) => {
                    mcContainer.innerHTML += `
                        <div id="opt-card-${idx}" onclick="selectMC(${idx})" class="opt-btn flex items-center justify-between p-4 border-2 border-gray-200 rounded-xl cursor-pointer hover:border-blue-400 bg-white transition">
                            <div class="flex items-center">
                                <span class="w-7 h-7 rounded-full border-2 border-gray-300 flex items-center justify-center mr-3 font-bold text-sm text-gray-500" id="opt-circle-${idx}">${String.fromCharCode(65 + idx)}</span>
                                <span class="text-gray-800 font-medium">${opt}</span>
                            </div>
                            <span id="opt-status-${idx}" class="font-bold text-sm"></span>
                        </div>
                    `;
                });
            } else if (q.type === 'tf') {
                document.getElementById('question-type-badge').innerText = "Phần 2: Trắc nghiệm Đúng - Sai";
                tfContainer.classList.remove('hidden');
                tfContainer.innerHTML = '';
                q.sub.forEach((subItem, subIdx) => {
                    tfContainer.innerHTML += `
                        <div id="tf-card-${subIdx}" class="p-4 bg-gray-50 border border-gray-200 rounded-xl">
                            <p class="font-medium text-gray-800 mb-2">${String.fromCharCode(97 + subIdx)}) ${subItem.text}</p>
                            <div class="flex gap-4">
                                <label class="flex items-center cursor-pointer font-semibold text-gray-700"><input type="radio" name="tf_${subIdx}" value="true" class="mr-2 w-4 h-4 text-blue-600"> Đúng</label>
                                <label class="flex items-center cursor-pointer font-semibold text-gray-700"><input type="radio" name="tf_${subIdx}" value="false" class="mr-2 w-4 h-4 text-blue-600"> Sai</label>
                            </div>
                        </div>
                    `;
                });
            } else if (q.type === 'short') {
                document.getElementById('question-type-badge').innerText = "Phần 3: Trả lời ngắn";
                saContainer.classList.remove('hidden');
                const input = document.getElementById('short-input');
                input.value = '';
                input.className = "w-full p-4 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none text-lg bg-white";
                input.disabled = false;
            }

            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise();
            }
        }

        function selectMC(idx) {
            if (isChecked) return;
            selectedMCIdx = idx;
            document.querySelectorAll('.opt-btn').forEach((btn, i) => {
                if (i === idx) {
                    btn.className = "opt-btn flex items-center justify-between p-4 border-2 border-blue-500 bg-blue-50 rounded-xl cursor-pointer transition";
                } else {
                    btn.className = "opt-btn flex items-center justify-between p-4 border-2 border-gray-200 bg-white rounded-xl cursor-pointer transition";
                }
            });
        }

        function handleAction() {
            if (!isChecked) {
                const q = activeQuestions[currentIndex];
                
                if (q.type === 'mc') {
                    if (selectedMCIdx === null) { alert("Vui lòng chọn một đáp án!"); return; }
                    
                    const userCard = document.getElementById(`opt-card-${selectedMCIdx}`);
                    const userStatus = document.getElementById(`opt-status-${selectedMCIdx}`);
                    const correctCard = document.getElementById(`opt-card-${q.correct}`);
                    const correctStatus = document.getElementById(`opt-status-${q.correct}`);

                    if (selectedMCIdx === q.correct) {
                        userCard.className = "opt-btn flex items-center justify-between p-4 border-2 border-emerald-500 bg-emerald-50 rounded-xl transition";
                        userStatus.className = "text-emerald-600 font-bold";
                        userStatus.innerText = "✓ Đúng rồi!";
                        score++;

                        userCard.className = "opt-btn flex items-center justify-between p-4 border-2 border-rose-500 bg-rose-50 rounded-xl transition";

                        userStatus.innerText = "✗ Sai mất rồi";
                        
                        correctCard.className = "opt-btn flex items-center justify-between p-4 border-2 border-emerald-500 bg-emerald-50 rounded-xl transition";
                        correctStatus.className = "text-emerald-600 font-bold";
                        correctStatus.innerText = "✓ Đáp án đúng";
                    }

                    let complete = true;
                    q.sub.forEach((subItem, subIdx) => {
                        const sel = document.querySelector(`input[name="tf_${subIdx}"]:checked`);
                        const card = document.getElementById(`tf-card-${subIdx}`);
                        if (!sel) complete = false;
                        else {
                            const val = sel.value === 'true';
                            if (val === subItem.ans) {
                                card.className = "p-4 bg-emerald-50 border-2 border-emerald-500 rounded-xl";
                            } else {
                                card.className = "p-4 bg-rose-50 border-2 border-rose-500 rounded-xl";
                            }
                        }
                    });
                    if (!complete) { alert("Vui lòng làm đủ các câu a, b, c, d!"); return; }
                } else if (q.type === 'short') {
                    const input = document.getElementById('short-input');
                    const val = input.value.trim();
                    if (!val) { alert("Vui lòng nhập câu trả lời!"); return; }
                    input.disabled = true;
                    if (val.toLowerCase() === String(q.correct).toLowerCase()) {
                        input.className = "w-full p-4 border-2 border-emerald-500 bg-emerald-50 font-bold text-emerald-800 rounded-xl text-lg";
                        score++;
                    } else {
                        input.className = "w-full p-4 border-2 border-rose-500 bg-rose-50 font-bold text-rose-800 rounded-xl text-lg";
                    }
                }

                const expBox = document.getElementById('explanation-box');
                expBox.className = "p-4 rounded-xl mb-6 text-sm bg-blue-50 text-blue-900 border border-blue-200";
                expBox.innerHTML = `<strong>📖 Hướng dẫn giải thích:</strong> ${q.rationale}`;
                expBox.classList.remove('hidden');

                isChecked = true;
                document.getElementById('action-btn').innerText = (currentIndex === activeQuestions.length - 1) ? "Xem kết quả" : "Câu tiếp theo ➜";

                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise();
                }
            } else {
                currentIndex++;
                if (currentIndex < activeQuestions.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            }
        }

        function showHint() {
            alert(`💡 Gợi ý: ${activeQuestions[currentIndex].hint}`);
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score} / ${activeQuestions.length} câu đúng`;
        }

        // Khởi tạo mặc định
        switchSubject('khtn');
    </script>
</body>
</html>
